[package]
name = "secret-secret-service-keyring-store"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Encrypted keyring backend using a caller-provided secret"
license = "MIT OR Apache-2.0"

[dependencies]
keyring-core = "1.0.1"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"
rand = "0.10"
tempfile = "3.27"
zeroize = { version = "1.8", features = ["serde"] }
